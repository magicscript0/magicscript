<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      `viewport-fit=cover` opts into the unsafe area (notch / Dynamic Island /
      home indicator), which the app then respects through env(safe-area-inset-*)
      in index.css. `interactive-widget=resizes-content` (Android Chrome 108+,
      ignored elsewhere) makes the on-screen keyboard shrink the layout viewport
      instead of only the visual one, so the Login screen keeps its dvh-based
      geometry while the keyboard is open. Everything else is unchanged.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#070a0d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="MAGIC SCRIPT — Apple of Fortune game experience and administrative command center." />
    <title>MAGIC SCRIPT</title>
    <!--
      Painted before the stylesheet arrives so the first frame is never white
      (and so no late-loading background can shift the layout).
    -->
    <style>
      html { background: #070a0d; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
